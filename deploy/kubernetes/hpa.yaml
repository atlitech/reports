# Optional: requires metrics-server and representative load testing. Keep the per-pod conversion
# limit fixed; scaling creates capacity without multiplying browser concurrency within a pod.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: reports
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: reports
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
