# Private, self-hosted deployment for application-owned templates. This is not a hostile-HTML
# sandbox. Before applying, create reports-auth from scripts/create-reports-api-key.sh's server.env,
# select the namespace, and replace the image with a tested immutable image from your registry.
#
# Chromium runs with its own sandbox, which needs unprivileged user namespaces. The pod therefore
# uses the seccomp profile deploy/seccomp/chromium.json (Docker's default plus those namespaces; see
# deploy/seccomp/README.md) instead of RuntimeDefault, which denies them. Install the file on every
# node that can run the pod, under the kubelet's seccomp root:
#   /var/lib/kubelet/seccomp/atli-reports/chromium.json
# for example with your node provisioning, or by copying it onto each node. Without it the kubelet
# cannot create the container ("cannot load seccomp profile"); under RuntimeDefault the browser
# cannot start and /health/details says why. The file is already resolved for containers without
# capabilities, because containerd reads Localhost profiles as plain OCI seccomp and ignores
# Docker's conditional rules. The profile lets every process in the pod, not only Chromium, create
# user and network namespaces with capabilities inside them, which widens the kernel surface open
# to a compromised server; deploy/seccomp/README.md ("What the profile allows") explains the trade.
#
# Ubuntu 23.10+ and 24.04 nodes also restrict unprivileged user namespaces through AppArmor
# (kernel.apparmor_restrict_unprivileged_userns=1), for AppArmor-unconfined processes. Containers
# under Docker's default AppArmor profile keep the sandbox there (verified in CI on Ubuntu 24.04
# with Docker 28.0.4); pods under containerd's default profile on Ubuntu nodes were not tested. If
# the browser fails closed on such a node, check its AppArmor profile first. Pods that run
# AppArmor-unconfined need the sysctl set to 0 on the node; kind clusters are one case, because
# containerd inside a kind node applies no AppArmor profile. Only for trusted HTML on nodes that
# cannot allow user namespaces, use RuntimeDefault and set ReportsEngine__Browser__NoSandbox=true
# instead.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reports
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: reports
  template:
    metadata:
      labels:
        app: reports
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        # deploy/seccomp/chromium.json, installed on the node (see above).
        seccompProfile:
          type: Localhost
          localhostProfile: atli-reports/chromium.json
      containers:
        - name: reports
          image: atli-reports-server:security
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: reports-auth
          env:
            - name: ReportsEngine__Network__Mode
              value: Disabled
            - name: ReportsEngine__Concurrency__MaxConcurrentConversions
              value: "2"
            - name: ReportsEngine__Concurrency__MaxQueueLength
              value: "8"
            - name: ReportsEngine__Browser__ShutdownTimeout
              value: "00:01:10"
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: temporary
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /health/live
              port: http
              scheme: HTTP
            periodSeconds: 5
            failureThreshold: 24
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: reports
spec:
  type: ClusterIP
  selector:
    app: reports
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: reports
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: reports
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: reports
spec:
  podSelector:
    matchLabels:
      app: reports
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        # Only explicitly labelled clients in this namespace. Authentication still applies.
        - podSelector:
            matchLabels:
              reports-client: "true"
      ports:
        - protocol: TCP
          port: 8080
  # The API-key profile and self-contained documents need no network egress. JWT signing-key
  # discovery and OTLP export require narrowly scoped extra rules; do not add unrestricted egress.
  egress: []
