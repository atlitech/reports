<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Quarterly performance dashboard</title>
    <!--
      Benchmark fixture "chart": the page draws its charts with JavaScript after an asynchronous
      "data load", then signals that it is ready to print. Fully self-contained: no network fetches.

      The readiness contract is identical for both targets:
        - Atli.Reports waits for the page to call window.reportReady()   (waitForSignal: "reportReady")
        - Gotenberg polls until window.reportRendered === true            (waitForExpression)
      signalRendered() below does both at the same moment, after the charts are in the DOM and a
      frame has been laid out.

      Without waiting, a converter would print an empty dashboard; the "Rendered series" line in the
      summary only appears once the charts exist.
    -->
    <style>
      @page {
        size: A4;
      }
      body {
        margin: 0;
        font-family: "Liberation Sans", Arial, Helvetica, sans-serif;
        font-size: 10pt;
        color: #1f2933;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 18pt;
        color: #0f4c81;
      }
      .subtitle {
        margin: 0 0 14px;
        color: #52606d;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .card {
        border: 1px solid #d9e2ec;
        border-radius: 8px;
        padding: 10px 12px;
        break-inside: avoid;
      }
      .card h2 {
        margin: 0 0 6px;
        font-size: 11pt;
      }
      .card svg {
        display: block;
        width: 100%;
        height: auto;
      }
      .wide {
        grid-column: 1 / span 2;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 9pt;
      }
      th,
      td {
        padding: 4px 6px;
        border-bottom: 1px solid #e4e7eb;
        text-align: right;
      }
      th:first-child,
      td:first-child {
        text-align: left;
      }
      #status {
        color: #52606d;
        font-size: 8.5pt;
      }
    </style>
  </head>
  <body>
    <h1>Quarterly performance dashboard</h1>
    <p class="subtitle">Region: North America · Period: 2026 Q3 · Generated by client-side script</p>
    <div class="grid">
      <div class="card wide">
        <h2>Daily revenue (USD thousands)</h2>
        <div id="line"></div>
      </div>
      <div class="card">
        <h2>Revenue by product line</h2>
        <div id="bars"></div>
      </div>
      <div class="card">
        <h2>Channel mix</h2>
        <div id="donut"></div>
      </div>
      <div class="card wide">
        <h2>Weekly orders vs. returns</h2>
        <div id="area"></div>
      </div>
      <div class="card wide">
        <h2>Summary by product line</h2>
        <table id="summary">
          <thead>
            <tr>
              <th>Product line</th>
              <th>Revenue</th>
              <th>Orders</th>
              <th>Avg. order</th>
              <th>Share</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <p id="status">Loading data…</p>
      </div>
    </div>

    <script>
      (function () {
        "use strict";

        var SVG_NS = "http://www.w3.org/2000/svg";
        var PALETTE = ["#0f4c81", "#2bb0ed", "#3ebd93", "#f0b429", "#ef4e4e", "#9446ed"];

        // Deterministic pseudo-random numbers, so every conversion draws the same charts.
        var seed = 20260930;
        function random() {
          seed = (seed * 1664525 + 1013904223) >>> 0;
          return seed / 4294967296;
        }

        function el(name, attributes, parent) {
          var node = document.createElementNS(SVG_NS, name);
          for (var key in attributes) {
            node.setAttribute(key, String(attributes[key]));
          }
          if (parent) {
            parent.appendChild(node);
          }
          return node;
        }

        function svg(width, height, host) {
          var root = el("svg", { viewBox: "0 0 " + width + " " + height, width: width, height: height });
          document.getElementById(host).appendChild(root);
          return root;
        }

        function axes(root, width, height, pad, maxValue, ticks) {
          for (var i = 0; i <= ticks; i++) {
            var y = height - pad - ((height - 2 * pad) * i) / ticks;
            el("line", { x1: pad, x2: width - 8, y1: y, y2: y, stroke: "#e4e7eb" }, root);
            var label = el("text", { x: pad - 6, y: y + 3, "text-anchor": "end", "font-size": 9, fill: "#52606d" }, root);
            label.textContent = Math.round((maxValue * i) / ticks);
          }
        }

        function lineChart(data) {
          var width = 720, height = 170, pad = 30;
          var root = svg(width, height, "line");
          var max = Math.max.apply(null, data) * 1.1;
          axes(root, width, height, pad, max, 5);
          var step = (width - pad - 8) / (data.length - 1);
          var points = data.map(function (v, i) {
            return (pad + i * step).toFixed(1) + "," + (height - pad - (v / max) * (height - 2 * pad)).toFixed(1);
          });
          el("polyline", { points: points.join(" "), fill: "none", stroke: PALETTE[0], "stroke-width": 2 }, root);
          data.forEach(function (v, i) {
            if (i % 7 === 0) {
              el("circle", { cx: pad + i * step, cy: height - pad - (v / max) * (height - 2 * pad), r: 2.5, fill: PALETTE[1] }, root);
            }
          });
        }

        function barChart(lines) {
          var width = 340, height = 190, pad = 32;
          var root = svg(width, height, "bars");
          var max = Math.max.apply(null, lines.map(function (l) { return l.revenue; })) * 1.1;
          axes(root, width, height, pad, max, 4);
          var slot = (width - pad - 8) / lines.length;
          lines.forEach(function (line, i) {
            var h = (line.revenue / max) * (height - 2 * pad);
            el("rect", { x: pad + i * slot + 6, y: height - pad - h, width: slot - 12, height: h, rx: 3, fill: PALETTE[i % PALETTE.length] }, root);
            var label = el("text", { x: pad + i * slot + slot / 2, y: height - pad + 12, "text-anchor": "middle", "font-size": 8, fill: "#52606d" }, root);
            label.textContent = line.code;
          });
        }

        function donutChart(shares) {
          var width = 340, height = 190, cx = 100, cy = 95, r = 76, inner = 44;
          var root = svg(width, height, "donut");
          var total = shares.reduce(function (sum, s) { return sum + s.value; }, 0);
          var angle = -Math.PI / 2;
          shares.forEach(function (share, i) {
            var sweep = (share.value / total) * Math.PI * 2;
            var end = angle + sweep;
            var large = sweep > Math.PI ? 1 : 0;
            var d = [
              "M", cx + r * Math.cos(angle), cy + r * Math.sin(angle),
              "A", r, r, 0, large, 1, cx + r * Math.cos(end), cy + r * Math.sin(end),
              "L", cx + inner * Math.cos(end), cy + inner * Math.sin(end),
              "A", inner, inner, 0, large, 0, cx + inner * Math.cos(angle), cy + inner * Math.sin(angle),
              "Z",
            ].join(" ");
            el("path", { d: d, fill: PALETTE[i % PALETTE.length] }, root);
            el("rect", { x: 210, y: 40 + i * 22, width: 12, height: 12, rx: 2, fill: PALETTE[i % PALETTE.length] }, root);
            var label = el("text", { x: 228, y: 50 + i * 22, "font-size": 10, fill: "#1f2933" }, root);
            label.textContent = share.name + " " + Math.round((share.value / total) * 100) + "%";
            angle = end;
          });
        }

        function areaChart(orders, returns) {
          var width = 720, height = 150, pad = 28;
          var root = svg(width, height, "area");
          var max = Math.max.apply(null, orders) * 1.1;
          axes(root, width, height, pad, max, 4);
          var step = (width - pad - 8) / (orders.length - 1);
          [orders, returns].forEach(function (series, s) {
            var top = series.map(function (v, i) {
              return (pad + i * step).toFixed(1) + "," + (height - pad - (v / max) * (height - 2 * pad)).toFixed(1);
            });
            var area = top.concat([(pad + (series.length - 1) * step).toFixed(1) + "," + (height - pad), pad + "," + (height - pad)]);
            el("polygon", { points: area.join(" "), fill: PALETTE[s * 3], "fill-opacity": 0.25 }, root);
            el("polyline", { points: top.join(" "), fill: "none", stroke: PALETTE[s * 3], "stroke-width": 1.5 }, root);
          });
        }

        function summaryTable(lines) {
          var body = document.querySelector("#summary tbody");
          var total = lines.reduce(function (sum, l) { return sum + l.revenue; }, 0);
          lines.forEach(function (line) {
            var row = document.createElement("tr");
            [
              line.name,
              "$" + line.revenue.toFixed(1) + "k",
              String(line.orders),
              "$" + ((line.revenue * 1000) / line.orders).toFixed(2),
              ((line.revenue / total) * 100).toFixed(1) + "%",
            ].forEach(function (text) {
              var cell = document.createElement("td");
              cell.textContent = text;
              row.appendChild(cell);
            });
            body.appendChild(row);
          });
        }

        function loadData() {
          // Stands in for an asynchronous data fetch; resolves on a later task.
          return new Promise(function (resolve) {
            setTimeout(function () {
              var daily = [];
              var value = 120;
              for (var d = 0; d < 92; d++) {
                value = Math.max(40, value + (random() - 0.47) * 18);
                daily.push(Math.round(value * 10) / 10);
              }
              var names = ["Analytics", "Storage", "Compute", "Support", "Training", "Marketplace"];
              var lines = names.map(function (name) {
                return {
                  name: name,
                  code: name.slice(0, 3).toUpperCase(),
                  revenue: Math.round((200 + random() * 800) * 10) / 10,
                  orders: 300 + Math.floor(random() * 2400),
                };
              });
              var channels = ["Direct", "Partners", "Online", "Field"].map(function (name) {
                return { name: name, value: 10 + random() * 40 };
              });
              var orders = [];
              var returns = [];
              for (var w = 0; w < 26; w++) {
                var o = 400 + random() * 600;
                orders.push(Math.round(o));
                returns.push(Math.round(o * (0.04 + random() * 0.08)));
              }
              resolve({ daily: daily, lines: lines, channels: channels, orders: orders, returns: returns });
            }, 25);
          });
        }

        function signalRendered() {
          // Gotenberg: waitForExpression "window.reportRendered === true".
          window.reportRendered = true;
          // Atli.Reports: waitForSignal "reportReady" exposes window.reportReady().
          if (typeof window.reportReady === "function") {
            window.reportReady();
          }
        }

        loadData().then(function (data) {
          lineChart(data.daily);
          barChart(data.lines);
          donutChart(data.channels);
          areaChart(data.orders, data.returns);
          summaryTable(data.lines);
          document.getElementById("status").textContent =
            "Rendered series: " + (data.daily.length + data.lines.length + data.channels.length + data.orders.length * 2);
          // Print only after the charts have been laid out.
          requestAnimationFrame(function () {
            requestAnimationFrame(signalRendered);
          });
        });
      })();
    </script>
  </body>
</html>
