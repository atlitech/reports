services:
  server:
    build:
      context: ../..
      dockerfile: src/Atli.Reports.Server/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      # Generate from the repository root: scripts/create-reports-api-key.sh
      - ../../.reports-secrets/server.env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      # Docker's default profile plus the user namespaces Chromium's sandbox needs
      # (deploy/seccomp/README.md). Without it the browser cannot start.
      - seccomp=../../deploy/seccomp/chromium.json
    stop_grace_period: 90s
