name: Aspire end to end

# Starts examples/Atli.Reports.AppHost with Aspire.Hosting.Testing and converts real documents through
# its resources (tests/Atli.Reports.AppHost.Tests): the reports server container built from this
# checkout, the remote example that converts through Atli.Reports.Client, and the examples that run
# the engine in-process with the runner's Google Chrome. Tailwind report stylesheets compile as
# part of the .NET project build.
#
# The orchestrator (DCP) comes from the Aspire CLI bundle: building the AppHost, which sets
# AspireUseCliBundle, installs the CLI release paired with its SDK through dnx when no Aspire CLI is
# installed, and writes the bundle's paths into the AppHost assembly for Aspire.Hosting.Testing.
#
# Required through Dependency validation when relevant: it needs Docker and builds the server image (three to four minutes),
# so the solution's `dotnet test` in build-on-pull-request.yml leaves the project out (Atli.Reports.slnx
# does not build it).

on:
  workflow_call:
  push:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "examples/**"
      - "tests/Atli.Reports.AppHost.Tests/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - ".github/workflows/aspire-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aspire-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apphost:
    name: AppHost end to end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Show the tools the AppHost uses
        run: |
          docker version --format 'Docker {{.Server.Version}}'
          google-chrome --version

      - name: Build
        run: dotnet build tests/Atli.Reports.AppHost.Tests/Atli.Reports.AppHost.Tests.csproj

      - name: Run the end-to-end tests
        run: >-
          dotnet test --project tests/Atli.Reports.AppHost.Tests/Atli.Reports.AppHost.Tests.csproj
          --no-build --results-directory artifacts/aspire-e2e/test-results --report-trx

      # The test results, and each resource's console output (the server image build included), one
      # file per resource in resource-logs. Also when the job times out.
      - name: Upload diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aspire-e2e-diagnostics
          path: |
            artifacts/aspire-e2e/
            artifacts/bin/Atli.Reports.AppHost.Tests/debug/TestResults/
          if-no-files-found: warn
          retention-days: 14
