name: Publish the server image

# Builds ghcr.io/atlitech/reports-server from a commit of this repository and publishes it, for
# release.yml (a new release) and server-image-refresh.yml (the newest release rebuilt with a newer
# pinned chrome-headless-shell).
#
# Jobs: build (one native build per architecture, pushed by digest without a tag, then pulled back,
# checked for the requested Chrome version and smoke-tested) -> manifest (the multi-arch index,
# tagged only once both architectures pass, with an SBOM and BuildKit provenance per image and a
# GitHub artifact attestation for the index). Tagging and its guards live in
# .github/scripts/server-image.sh push-manifest: <version>-chrome<chrome-version> is always added and
# never moves to a different image.
#
# The calling job grants the permissions: contents: read, packages: write, id-token: write,
# attestations: write, artifact-metadata: write.

on:
  workflow_call:
    inputs:
      ref:
        description: The full SHA of the commit to build.
        type: string
        required: true
      version:
        description: The release version the image carries, such as 0.26.0.
        type: string
        required: true
      chrome-version:
        description: The chrome-headless-shell version to build with (the CHROME_VERSION build argument).
        type: string
        required: true
      tags:
        description: Space-separated tags to point at the image, such as "0.26.0 0.26 latest".
        type: string
        required: true
      only-move-from:
        description: An index digest. When set, a tag in `tags` moves only if it points at that index now.
        type: string
        default: ""
      environment:
        description: The deployment environment the jobs run in; empty for none.
        type: string
        default: ""
    outputs:
      digest:
        description: The digest of the published multi-arch index.
        value: ${{ jobs.manifest.outputs.digest }}

# No workflow-level permissions: each job declares what it needs, within what the caller grants.

env:
  IMAGE: ghcr.io/atlitech/reports-server
  IMAGE_TITLE: Atli Reports Server
  IMAGE_DESCRIPTION: HTML to PDF over HTTP. A NativeAOT server over chrome-headless-shell.
  IMAGE_LICENSES: Apache-2.0

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check the inputs
        env:
          REF: ${{ inputs.ref }}
          CHROME_VERSION: ${{ inputs.chrome-version }}
        run: |
          if [[ ! "$REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::ref '$REF' is not a full commit SHA."
            exit 1
          fi
          if [[ ! "$CHROME_VERSION" =~ ^[0-9]+(\.[0-9]+){3}$ ]]; then
            echo "::error::chrome-version '$CHROME_VERSION' is not a version such as 154.0.8037.92."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed untagged; the manifest job tags the multi-arch index once both architectures pass.
      # CHROME_VERSION is passed even when it equals the Dockerfile's pin, so the provenance records
      # it. No build cache: the image picks up the current Ubuntu security updates, and never reuses
      # layers another workflow wrote.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/Atli.Reports.Server/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: CHROME_VERSION=${{ inputs.chrome-version }}
          labels: |
            org.opencontainers.image.title=${{ env.IMAGE_TITLE }}
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ inputs.ref }}
            org.opencontainers.image.licenses=${{ env.IMAGE_LICENSES }}
            io.github.atlitech.reports.chrome-version=${{ inputs.chrome-version }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          no-cache: true
          sbom: true
          provenance: mode=max

      # The checks below test exactly what was pushed.
      - name: Pull the pushed image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker pull "$IMAGE@$DIGEST"

      - name: Check the browser version
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          CHROME_VERSION: ${{ inputs.chrome-version }}
        run: |
          actual="$(docker run --rm --entrypoint /opt/chrome-headless-shell/chrome-headless-shell "$IMAGE@$DIGEST" --version)"
          echo "$actual"
          if [ "${actual##* }" != "$CHROME_VERSION" ]; then
            echo "::error::The image has '$actual', not chrome-headless-shell $CHROME_VERSION."
            exit 1
          fi

      # The smoke test of the commit being built, so it checks what that version of the server does.
      - name: Smoke test the pushed image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: .github/scripts/smoke-test-server-image.sh "$IMAGE@$DIGEST"

      - name: Verify JWT authentication in the NativeAOT image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: python3 .github/scripts/smoke-test-server-jwt.py "$IMAGE@$DIGEST"

      - name: Record the digest
        env:
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          echo "$DIGEST" > "$RUNNER_TEMP/digests/$ARCH"

      - name: Upload the digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  manifest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      # The workflow's own commit, for .github/scripts/server-image.sh; the image's source is
      # inputs.ref.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Download the digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push the multi-arch index
        id: manifest
        env:
          VERSION: ${{ inputs.version }}
          CHROME_VERSION: ${{ inputs.chrome-version }}
          TAGS: ${{ inputs.tags }}
          ONLY_MOVE_FROM: ${{ inputs.only-move-from }}
          REVISION: ${{ inputs.ref }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          sources=()
          for arch in amd64 arm64; do
            digest="$(cat "$RUNNER_TEMP/digests/$arch")"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::No valid $arch image digest was recorded."
              exit 1
            fi
            sources+=("$IMAGE@$digest")
          done
          .github/scripts/server-image.sh push-manifest "${sources[@]}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
