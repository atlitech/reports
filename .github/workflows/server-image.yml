name: Server image

# Builds the Atli.Reports.Server container image natively on amd64 and arm64, with the
# chrome-headless-shell version the Dockerfile pins, checks that the image has that browser version,
# and smoke-tests each build with .github/scripts/smoke-test-server-image.sh: under the seccomp
# profile deploy/seccomp/chromium.json the server becomes ready, converts a small document to a PDF,
# runs as a non-root user under tini with Chromium's sandbox, and shuts down cleanly; under Docker's
# default profile it fails closed. It also checks that the profile is still Docker's default at its
# pinned moby/profiles commit plus Chromium's rules. Nothing is pushed; release.yml publishes the
# image.
#
# This is not a required check: it only runs when something that goes into the image changes.

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "src/Atli.Reports.Engine/**"
      - "src/Atli.Reports.Server/**"
      - "src/Atli.Reports.Worker.Protocol/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - ".github/workflows/server-image.yml"
      - ".github/scripts/smoke-test-server-image.sh"
      - ".github/scripts/smoke-test-server-jwt.py"
      - ".github/scripts/validate-kubernetes-security.sh"
      - "scripts/create-reports-api-key.sh"
      - "deploy/kubernetes/**"
      - "deploy/seccomp/**"
      - ".github/scripts/chromium-seccomp-profile.py"
      - ".github/scripts/chrome-headless-shell.sh"
  push:
    branches: [ "main" ]
    paths:
      - "src/Atli.Reports.Engine/**"
      - "src/Atli.Reports.Server/**"
      - "src/Atli.Reports.Worker.Protocol/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - ".github/workflows/server-image.yml"
      - ".github/scripts/smoke-test-server-image.sh"
      - ".github/scripts/smoke-test-server-jwt.py"
      - ".github/scripts/validate-kubernetes-security.sh"
      - "scripts/create-reports-api-key.sh"
      - "deploy/kubernetes/**"
      - "deploy/seccomp/**"
      - ".github/scripts/chromium-seccomp-profile.py"
      - ".github/scripts/chrome-headless-shell.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-smoke-test:
    name: Build and smoke test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The profile the smoke tests run with must be the pinned upstream profile plus Chromium's
      # rules, nothing else. Architecture-independent, so once.
      - name: Check the seccomp profile against moby/profiles
        if: matrix.arch == 'amd64'
        run: python3 .github/scripts/chromium-seccomp-profile.py check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The Dockerfile's CHROME_VERSION default is the pinned version; changing it misses the cached
      # browser layer, so a pin update is downloaded and tested here before a release ships it.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/Atli.Reports.Server/Dockerfile
          platforms: linux/${{ matrix.arch }}
          tags: reports-server:smoke-test
          load: true
          # Only the release build is attested.
          provenance: false
          cache-from: type=gha,scope=server-image-${{ matrix.arch }}
          cache-to: type=gha,scope=server-image-${{ matrix.arch }},mode=max

      - name: Check the browser version
        run: |
          pinned="$(.github/scripts/chrome-headless-shell.sh pinned)"
          actual="$(docker run --rm --entrypoint /opt/chrome-headless-shell/chrome-headless-shell reports-server:smoke-test --version)"
          echo "$actual"
          if [ "${actual##* }" != "$pinned" ]; then
            echo "::error::The image has '$actual', not the pinned chrome-headless-shell $pinned."
            exit 1
          fi

      - name: Smoke test
        run: .github/scripts/smoke-test-server-image.sh reports-server:smoke-test

      - name: Verify JWT authentication in the NativeAOT image
        run: python3 .github/scripts/smoke-test-server-jwt.py reports-server:smoke-test

      # kind runs pods without an AppArmor profile, so the runner's AppArmor restriction on
      # unprivileged user namespaces (Ubuntu 24.04's default) would stop Chromium's sandbox in them.
      # Nodes that apply containerd's default AppArmor profile are unaffected only with a containerd
      # whose profile declares ABI 3.0; see deploy/kubernetes/reports.yaml.
      - name: Validate Kubernetes deployment in a disposable cluster
        if: matrix.arch == 'amd64'
        run: |
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = 1 ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          curl --fail --silent --show-error --location \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.31.0/kind-linux-amd64 \
            --output "$RUNNER_TEMP/kind-linux-amd64"
          printf '%s  %s\n' \
            eb244cbafcc157dff60cf68693c14c9a75c4e6e6fedaf9cd71c58117cb93e3fa \
            "$RUNNER_TEMP/kind-linux-amd64" | sha256sum --check
          chmod 700 "$RUNNER_TEMP/kind-linux-amd64"
          KIND_BIN="$RUNNER_TEMP/kind-linux-amd64" \
            .github/scripts/validate-kubernetes-security.sh reports-server:smoke-test
