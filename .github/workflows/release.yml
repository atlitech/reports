name: Release

# Publishes a GitHub release: the server container image to ghcr.io/atlitech/reports-server, then the
# packable projects to nuget.org. Packages are pushed only after the image is published, so a release
# never ships packages that point at a missing image.
#
# Jobs: pack (packs and verifies the packages, which proves the release tag is the version in
# Directory.Build.props) -> image-metadata (image tags, Chrome version) -> image-build (one native
# build per architecture, smoke-tested and pushed by digest) -> image (multi-arch manifest, tags,
# provenance attestation) -> publish (nuget.org).
#
# NuGet authentication is Trusted Publishing (OIDC), so no API key is stored in this repository. The
# nuget.org policy of the `atli` organization trusts this workflow file name (release.yml) in
# atlitech/reports running in the `release` environment, and that environment only accepts tags
# matching `[0-9]*`. Renaming this file or the environment breaks publishing until the policy on
# nuget.org is updated to match. The image is pushed with the workflow's GITHUB_TOKEN, from jobs in
# the same environment.

on:
  release:
    types: [ published ]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/atlitech/reports-server
  IMAGE_TITLE: Atli Reports Server
  IMAGE_DESCRIPTION: HTML to PDF over HTTP. A NativeAOT server over chrome-headless-shell.
  IMAGE_LICENSES: Apache-2.0

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Pack
        run: dotnet pack --configuration Release --output artifacts/release-packages

      # The BlazorReports and BlazorReports.Components package IDs are frozen at
      # 0.25.1 and stay with their original owner, so only Atli.Reports.* IDs may
      # be published. Every package must also carry the version being released.
      - name: Verify package IDs and versions
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          shopt -s nullglob
          packages=(artifacts/release-packages/*.nupkg)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "::error::dotnet pack produced no packages."
            exit 1
          fi
          for package in "${packages[@]}"; do
            name="$(basename "$package" .nupkg)"
            case "$name" in
              Atli.Reports.*) ;;
              *)
                echo "::error::$name is not an Atli.Reports.* package and must not be published."
                exit 1
                ;;
            esac
            if [[ "$name" != *".$TAG" ]]; then
              echo "::error::$name does not match release $TAG. Set <Version> in Directory.Build.props to $TAG first."
              exit 1
            fi
            echo "$name"
          done

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: artifacts/release-packages/
          if-no-files-found: error

  # Runs after pack, so the image is only built for a tag that pack verified against the version in
  # Directory.Build.props (which the server binary carries too).
  image-metadata:
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.tags.outputs.version }}
      tags: ${{ steps.tags.outputs.tags }}
      chrome-version: ${{ steps.chrome.outputs.version }}
    steps:
      # <version> always; <major>.<minor> unless the version has a pre-release suffix such as
      # -preview.1; latest only when the version has no suffix and the GitHub release is not marked
      # as a pre-release.
      - name: Compute image tags
        id: tags
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          if [[ ! "$TAG" =~ $semver ]]; then
            echo "::error::Release tag $TAG is not a version such as 0.26.0 or 0.26.0-preview.1."
            exit 1
          fi
          tags="$TAG"
          if [ -z "${BASH_REMATCH[4]}" ]; then
            tags="$tags ${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
            if [ "$PRERELEASE" != true ]; then
              tags="$tags latest"
            fi
          fi
          echo "Image tags: $tags"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      # Resolved once, so both architectures ship the same browser; the provenance attestation
      # records it as the CHROME_VERSION build argument.
      - name: Resolve the stable chrome-headless-shell version
        id: chrome
        run: |
          version="$(curl -fsSL --retry 3 https://googlechromelabs.github.io/chrome-for-testing/LATEST_RELEASE_STABLE)"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){3}$ ]]; then
            echo "::error::Chrome for Testing did not return a version number."
            exit 1
          fi
          echo "Chrome for Testing stable: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  image-build:
    name: image-build (${{ matrix.arch }})
    needs: image-metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed untagged; the image job tags the multi-arch manifest once both architectures pass.
      # No build cache: a release picks up the current base images and Ubuntu security updates, and
      # never reuses layers another workflow wrote.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/Atli.Reports.Server/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: CHROME_VERSION=${{ needs.image-metadata.outputs.chrome-version }}
          labels: |
            org.opencontainers.image.title=${{ env.IMAGE_TITLE }}
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.image-metadata.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=${{ env.IMAGE_LICENSES }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          no-cache: true
          sbom: true
          provenance: mode=max

      # Tests exactly what was pushed.
      - name: Smoke test the pushed image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker pull "$IMAGE@$DIGEST"
          .github/scripts/smoke-test-server-image.sh "$IMAGE@$DIGEST"

      - name: Record the digest
        env:
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          echo "$DIGEST" > "$RUNNER_TEMP/digests/$ARCH"

      - name: Upload the digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  image:
    needs: [ image-metadata, image-build ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download the digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The index annotations are what ghcr.io shows for a multi-arch image.
      - name: Create and push the multi-arch manifest
        id: manifest
        env:
          VERSION: ${{ needs.image-metadata.outputs.version }}
          TAGS: ${{ needs.image-metadata.outputs.tags }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          sources=()
          for arch in amd64 arm64; do
            digest="$(cat "$RUNNER_TEMP/digests/$arch")"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::No valid $arch image digest was recorded."
              exit 1
            fi
            sources+=("$IMAGE@$digest")
          done
          tag_arguments=()
          for tag in $TAGS; do
            tag_arguments+=(--tag "$IMAGE:$tag")
          done
          docker buildx imagetools create "${tag_arguments[@]}" \
            --annotation "index:org.opencontainers.image.title=$IMAGE_TITLE" \
            --annotation "index:org.opencontainers.image.description=$IMAGE_DESCRIPTION" \
            --annotation "index:org.opencontainers.image.source=$SOURCE" \
            --annotation "index:org.opencontainers.image.url=$SOURCE" \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            --annotation "index:org.opencontainers.image.revision=$REVISION" \
            --annotation "index:org.opencontainers.image.licenses=$IMAGE_LICENSES" \
            "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not read the digest of $IMAGE:$VERSION."
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

  publish:
    needs: [ pack, image ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: packages

      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: gabynevada

      # Symbol packages (.snupkg) next to each .nupkg are pushed with it.
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push "packages/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
