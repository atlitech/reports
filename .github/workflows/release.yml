name: Release

# Publishes a GitHub release: the server container image to ghcr.io/atlitech/reports-server, then the
# packable projects to nuget.org. Packages are pushed only after the image is published, so a release
# never ships packages that point at a missing image.
#
# Jobs: pack (packs and verifies the packages, which proves the release tag is the version in
# Directory.Build.props) -> image-metadata (image tags, and the Chrome version the release's
# Dockerfile pins) -> image (server-image-publish.yml: one native build per architecture, pushed by
# digest and smoke-tested, then the multi-arch index, its tags and the provenance attestation) ->
# publish (nuget.org).
#
# server-image-refresh.yml later rebuilds the newest release when main pins a newer
# chrome-headless-shell, moving the tags this workflow set (except <version>-chrome<chrome>).
#
# NuGet authentication is Trusted Publishing (OIDC), so no API key is stored in this repository. The
# nuget.org policy of the `atli` organization trusts this workflow file name (release.yml) in
# atlitech/reports running in the `release` environment, and that environment only accepts tags
# matching `[0-9]*`. Renaming this file or the environment breaks publishing until the policy on
# nuget.org is updated to match. The image is pushed with the workflow's GITHUB_TOKEN, from jobs in
# the same environment (server-image-publish.yml runs its jobs in the environment it is given).

on:
  release:
    types: [ published ]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Pack
        run: dotnet pack --configuration Release --output artifacts/release-packages

      # The BlazorReports and BlazorReports.Components package IDs are frozen at
      # 0.25.1 and stay with their original owner, so only Atli.Reports.* IDs may
      # be published. Every package must also carry the version being released.
      - name: Verify package IDs and versions
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          shopt -s nullglob
          packages=(artifacts/release-packages/*.nupkg)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "::error::dotnet pack produced no packages."
            exit 1
          fi
          for package in "${packages[@]}"; do
            name="$(basename "$package" .nupkg)"
            case "$name" in
              Atli.Reports.*) ;;
              *)
                echo "::error::$name is not an Atli.Reports.* package and must not be published."
                exit 1
                ;;
            esac
            if [[ "$name" != *".$TAG" ]]; then
              echo "::error::$name does not match release $TAG. Set <Version> in Directory.Build.props to $TAG first."
              exit 1
            fi
            echo "$name"
          done

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: artifacts/release-packages/
          if-no-files-found: error

  # Runs after pack, so the image is only built for a tag that pack verified against the version in
  # Directory.Build.props (which the server binary carries too).
  image-metadata:
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.tags.outputs.version }}
      tags: ${{ steps.tags.outputs.tags }}
      chrome-version: ${{ steps.chrome.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # <version> always; <major>.<minor> unless the version has a pre-release suffix such as
      # -preview.1; latest only when the version has no suffix and the GitHub release is not marked
      # as a pre-release. server-image-publish.yml adds <version>-chrome<chrome-version>.
      - name: Compute image tags
        id: tags
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          tags="$(.github/scripts/server-image.sh release-tags "$TAG" "$PRERELEASE")"
          echo "Image tags: $tags"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      # The version the release's Dockerfile pins, so the release ships the browser its pull requests
      # tested. It is also passed as the CHROME_VERSION build argument, which the provenance records.
      - name: Read the pinned chrome-headless-shell version
        id: chrome
        run: |
          version="$(.github/scripts/chrome-headless-shell.sh pinned)"
          echo "chrome-headless-shell: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  image:
    needs: image-metadata
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/server-image-publish.yml
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.image-metadata.outputs.version }}
      chrome-version: ${{ needs.image-metadata.outputs.chrome-version }}
      tags: ${{ needs.image-metadata.outputs.tags }}
      environment: release

  publish:
    needs: [ pack, image ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: packages

      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: gabynevada

      # Symbol packages (.snupkg) next to each .nupkg are pushed with it.
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push "packages/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
