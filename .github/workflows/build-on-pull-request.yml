name: Build, validate formatting and run tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  format-and-build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Validate formatting
        run: dotnet csharpier check .

      - name: Test dependency automation
        run: python3 -m unittest discover -s .github/tests -p 'test_*.py' -v

      - name: Test benchmark tooling
        run: python3 -m unittest discover -s benchmarks/azure-sandboxes -p 'test_*.py' -v

      - name: Build
        run: dotnet build

      # The solution leaves the end-to-end tests out of its build, so `dotnet test` below does not run
      # them (they need Docker; aspire-e2e.yml runs them). Compiling them here keeps them building.
      - name: Build the end-to-end tests
        run: dotnet build tests/Atli.Reports.AppHost.Tests/Atli.Reports.AppHost.Tests.csproj

      # Tests what the Build step built, without building the solution again.
      - name: Run tests
        run: dotnet test --no-build

      # Packs exactly what release.yml would publish, so packaging and package
      # validation failures surface on the pull request instead of on release day.
      - name: Pack
        run: dotnet pack --configuration Release --output artifacts/release-packages

  azure-publish:
    name: Publish hosted Azure infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # No Azure login, credentials, ACA CLI or cloud resources: publish must not contact Azure.
      - name: Publish the hosted reports AppHost
        run: >-
          dnx Aspire.Cli@13.6.0 -y -- publish
          --apphost examples/Atli.Reports.Azure.AppHost/Atli.Reports.Azure.AppHost.csproj
          -o artifacts/hosted-azure --non-interactive
      - name: Compile every generated Bicep module
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import subprocess
          templates = sorted(Path('artifacts/hosted-azure').rglob('*.bicep'))
          if not templates:
              raise SystemExit('Aspire published no Azure templates')
          for template in templates:
              subprocess.run(['az', 'bicep', 'build', '--file', str(template)], check=True)
          PYTHON

  tailwind-consumer:
    name: Tailwind consumer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Packs the actual NuGets, consumes them outside the repo, and invokes the real standalone
      # Tailwind compiler. Ubuntu also exercises actual computed styles through the PDF engine.
      - name: Test packed consumer build and publish
        if: matrix.os != 'ubuntu-latest'
        run: >-
          dotnet test --project tests/Atli.Reports.Tailwind.Tests/Atli.Reports.Tailwind.Tests.csproj
          --treenode-filter "/*/*/*/*[Category!=Browser]"

      - name: Test packed consumer and rendered styles
        if: matrix.os == 'ubuntu-latest'
        run: dotnet test --project tests/Atli.Reports.Tailwind.Tests/Atli.Reports.Tailwind.Tests.csproj

  dependency-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runtime: ${{ steps.paths.outputs.runtime }}
      devcontainer: ${{ steps.paths.outputs.devcontainer }}
      benchmark: ${{ steps.paths.outputs.benchmark }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select dependency checks
        id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 .github/scripts/dependency-paths.py "$BASE" >> "$GITHUB_OUTPUT"

  server-dependencies:
    needs: dependency-paths
    if: github.event_name == 'pull_request' && needs.dependency-paths.outputs.runtime == 'true'
    uses: ./.github/workflows/server-image.yml

  aspire-dependencies:
    needs: dependency-paths
    if: github.event_name == 'pull_request' && needs.dependency-paths.outputs.runtime == 'true'
    uses: ./.github/workflows/aspire-e2e.yml

  provisioner-dependencies:
    needs: dependency-paths
    if: needs.dependency-paths.outputs.runtime == 'true'
    # Publishing jobs are skipped without a version. Fork/Dependabot tokens remain read-only.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/provisioner-image.yml

  devcontainer-dependencies:
    needs: dependency-paths
    if: needs.dependency-paths.outputs.devcontainer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build development container
        run: docker build -f .devcontainer/Atli.Reports.Dev.Dockerfile -t reports-dev:test .

  benchmark-dependencies:
    needs: dependency-paths
    if: needs.dependency-paths.outputs.benchmark == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate benchmark image
        run: |
          docker compose -f benchmarks/load/compose.yaml config --quiet
          docker compose -f benchmarks/load/compose.yaml pull gotenberg

  dependency-validation:
    name: Dependency validation
    if: always()
    needs: [format-and-build-and-test, azure-publish, tailwind-consumer, dependency-paths, server-dependencies, aspire-dependencies, provisioner-dependencies, devcontainer-dependencies, benchmark-dependencies]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful dependency checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          for name, job in jobs.items():
              allowed = ('success',) if name in ('format-and-build-and-test', 'azure-publish', 'tailwind-consumer', 'dependency-paths') else ('success', 'skipped')
              if job['result'] not in allowed:
                  raise SystemExit(f"{name}: {job['result']}")
          PYTHON
