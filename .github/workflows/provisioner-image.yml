name: Provisioner image

# Called by PR validation, releases, and base-image refreshes. No version means build/test only.

on:
  workflow_call:
    inputs:
      ref:
        description: The full SHA of the commit to build.
        type: string
        default: ""
      version:
        description: The release version the image carries, such as 0.26.0.
        type: string
        default: ""
      tags:
        description: Space-separated tags to point at the image, such as "0.26.0 0.26 latest".
        type: string
        default: ""
      only-move-from:
        description: An index digest. When set, a tag in `tags` moves only if it points at that index now.
        type: string
        default: ""
      base-images:
        description: Approved tag-to-digest JSON. Only matching release base-image tags can be refreshed.
        type: string
        default: ""
      environment:
        description: The deployment environment the jobs run in; empty for none.
        type: string
        default: ""
    outputs:
      digest:
        description: The digest of the published multi-arch index.
        value: ${{ jobs.manifest.outputs.digest }}

# No workflow-level permissions: each job declares what it needs, within what the caller grants.

env:
  IMAGE: ghcr.io/atlitech/reports-provisioner
  IMAGE_TITLE: Atli Reports Provisioner
  IMAGE_DESCRIPTION: Tenant renderer provisioning service.
  IMAGE_LICENSES: Apache-2.0

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check the inputs
        env:
          REF: ${{ inputs.ref }}
        run: |
          if [ -n "$REF" ] && [[ ! "$REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::ref '$REF' is not a full commit SHA."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Checkout publishing tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .publish-tools
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Apply approved base-image pins
        id: bases
        env:
          BASE_IMAGES: ${{ inputs.base-images }}
        run: |
          fingerprint="$(python3 .publish-tools/.github/scripts/image-inputs.py apply src/Atli.Reports.Provisioner/Dockerfile --pins "$BASE_IMAGES")"
          echo "sha=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        if: inputs.version != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/Atli.Reports.Provisioner/Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.title=${{ env.IMAGE_TITLE }}
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ inputs.ref }}
            org.opencontainers.image.licenses=${{ env.IMAGE_LICENSES }}
            io.github.atlitech.reports.base-images-sha256=${{ steps.bases.outputs.sha }}
          tags: ${{ inputs.version == '' && 'reports-provisioner:test' || '' }}
          outputs: ${{ inputs.version != '' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=docker' }}
          no-cache: true
          sbom: ${{ inputs.version != '' }}
          provenance: ${{ inputs.version != '' && 'mode=max' || 'false' }}

      # The checks below test exactly what was pushed.
      - name: Pull the pushed image
        if: inputs.version != ''
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker pull "$IMAGE@$DIGEST"

      - name: Smoke test
        env:
          REFERENCE: ${{ inputs.version != '' && format('{0}@{1}', env.IMAGE, steps.build.outputs.digest) || 'reports-provisioner:test' }}
        run: python3 .publish-tools/.github/scripts/smoke-test-provisioner-image.py "$REFERENCE"

      - name: Record the digest
        if: inputs.version != ''
        env:
          BASE_IMAGES_SHA: ${{ steps.bases.outputs.sha }}
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          echo "$DIGEST" > "$RUNNER_TEMP/digests/$ARCH"
          echo "$BASE_IMAGES_SHA" > "$RUNNER_TEMP/digests/$ARCH.bases"

      - name: Upload the digest
        if: inputs.version != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provisioner-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}*
          if-no-files-found: error
          retention-days: 1

  manifest:
    if: inputs.version != ''
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      # The workflow's own commit, for .github/scripts/server-image.sh; the image's source is
      # inputs.ref.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Download the digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: provisioner-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        if: inputs.version != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push the multi-arch index
        id: manifest
        env:
          CHROME_VERSION: ""
          VERSION: ${{ inputs.version }}
          TAGS: ${{ inputs.tags }}
          ONLY_MOVE_FROM: ${{ inputs.only-move-from }}
          REVISION: ${{ inputs.ref }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          BASE_IMAGES_SHA="$(cat "$RUNNER_TEMP/digests/amd64.bases")"
          export BASE_IMAGES_SHA
          [[ "$BASE_IMAGES_SHA" =~ ^[0-9a-f]{64}$ ]]
          test "$BASE_IMAGES_SHA" = "$(cat "$RUNNER_TEMP/digests/arm64.bases")"
          sources=()
          for arch in amd64 arm64; do
            digest="$(cat "$RUNNER_TEMP/digests/$arch")"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::No valid $arch image digest was recorded."
              exit 1
            fi
            sources+=("$IMAGE@$digest")
          done
          .github/scripts/server-image.sh push-manifest "${sources[@]}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
